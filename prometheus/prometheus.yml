# Prometheus pulls ("scrapes") the API's /metrics every 15 seconds and keeps the history.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: endpoint-classifier
    static_configs:
      - targets: ["api:8000"] # the service name in docker-compose.yml
